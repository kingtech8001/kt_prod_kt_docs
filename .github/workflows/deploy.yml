name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (for toolchain dependencies if needed)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Build Flutter Web Release with Base Href
        run: |
          # Dynamically extract repository name from GITHUB_REPOSITORY (e.g. USERNAME/REPO_NAME -> /REPO_NAME/)
          REPO_NAME=$(echo "${{ github.repository }}" | awk -F '/' '{print $2}')
          echo "Building for repository: $REPO_NAME"
          flutter build web --release --web-renderer auto --base-href "/$REPO_NAME/"

      - name: Configure SPA Routing (Copy index.html to 404.html)
        run: |
          # Enables clean route refreshing (e.g. /documents, /settings) on GitHub Pages
          cp build/web/index.html build/web/404.html

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
