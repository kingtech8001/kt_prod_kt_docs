<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DocHolder - Document Vault & Management Platform">

  <!-- Critical Mobile Viewport for iPhone/Safari/Chrome -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Browser & Status Bar Theme Colors (Matches App Bar #FFFFFF) -->
  <meta name="theme-color" content="#FFFFFF">
  <meta name="msapplication-navbutton-color" content="#FFFFFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DocHolder">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DocHolder</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preconnect to Google Fonts CDN for faster font loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    html, body {
      background-color: #F8FAFC;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #F8FAFC;
      box-sizing: border-box;
      z-index: 999999;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.35s ease-out;
    }
    .loading-container.loaded {
      opacity: 0;
      visibility: hidden;
    }
    .loading-logo-box {
      width: 64px;
      height: 64px;
      background-color: #1E3A8A;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(30, 58, 138, 0.25);
      margin-bottom: 20px;
    }
    .loading-logo-box svg {
      width: 32px;
      height: 32px;
      fill: #FFFFFF;
    }
    .loading-title {
      font-size: 22px;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }
    .loading-subtitle {
      font-size: 13px;
      color: #475569;
      margin-bottom: 24px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E2E8F0;
      border-top-color: #1E3A8A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <img src="icons/Icon-192.png" alt="DocHolder Logo" width="72" height="72" style="border-radius: 18px; box-shadow: 0 10px 25px -5px rgba(30, 58, 138, 0.25); margin-bottom: 20px;">
    <div class="loading-title">DocHolder</div>
    <div class="loading-subtitle">Loading Document Vault...</div>
    <div class="spinner"></div>
  </div>

  <script>
    function removeLoader() {
      var loader = document.getElementById('loading');
      if (loader && !loader.classList.contains('loaded')) {
        loader.classList.add('loaded');
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 360);
      }
    }

    // Modern Flutter Web: detect Flutter canvas / flutter-view injection immediately
    var observer = new MutationObserver(function (mutations, obs) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('flt-scene-host')) {
        removeLoader();
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Legacy event listener fallback
    window.addEventListener('flutter-first-frame', function () {
      removeLoader();
    });

    // Safety fallback: ensure loader is always dismissed even on slow networks or unexpected delays
    setTimeout(removeLoader, 2000);

    // Auto-update service worker to discard stale cached JS bundles
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (var registration of registrations) {
          registration.update();
        }
      });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
